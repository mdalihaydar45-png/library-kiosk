<style>
:root{
  --bg:#f2f5f4; --surface:#ffffff; --ink:#14201f; --muted:#5b6b69; --line:#d9e2e0;
  --accent:#0b6b5e; --accent-ink:#ffffff; --warn:#b45309; --bad:#b42318; --good:#1a7f4b;
  --soft:#e3f0ed;
  --font-display:"Noto Serif Bengali","Hind Siliguri",Georgia,serif;
  --font-body:"Hind Siliguri","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1514; --surface:#162120; --ink:#e8f0ee; --muted:#9bb0ac; --line:#2a3b39;
    --accent:#3fb8a3; --accent-ink:#06211c; --warn:#f0a04b; --bad:#ff8a7a; --good:#5fd39a; --soft:#1d3330;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#162120; --ink:#e8f0ee; --muted:#9bb0ac; --line:#2a3b39;
  --accent:#3fb8a3; --accent-ink:#06211c; --warn:#f0a04b; --bad:#ff8a7a; --good:#5fd39a; --soft:#1d3330;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0 0 .5rem;line-height:1.25}
h2{font-size:1.35rem} h3{font-size:1.1rem}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.15rem}
.brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:.8rem;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.right{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:8px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.big{min-height:64px;font-size:1.2rem;padding:12px 24px;flex:1 1 200px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums;font-family:var(--font-display)}
.tile span{color:var(--muted);font-size:.85rem}
.tile.alert{border-left:5px solid var(--bad)}
label{display:block;font-size:.88rem;color:var(--muted);margin-bottom:4px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:42px}
.field{margin-bottom:12px;min-width:0}
input[type="date"]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;line-height:1.2}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 160px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.8rem;color:var(--muted);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:600;background:var(--soft);color:var(--accent)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.muted{color:var(--muted)}
.err{color:var(--bad);font-weight:600;margin:8px 0}
.ok{color:var(--good);font-weight:600}
.note{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:.9rem;margin-bottom:16px}
.kiosk{max-width:640px;margin:24px auto}
.kiosk h1{font-size:1.8rem;text-align:center}
.scanbox input{font-size:1.5rem;text-align:center;min-height:64px;letter-spacing:.06em}
.bookhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}
.price{font-family:var(--font-display);font-size:1.6rem;font-weight:700;color:var(--accent)}
.receipt{border:2px dashed var(--line);border-radius:12px;padding:18px;background:var(--surface)}
.receipt dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:12px 0}
.receipt dt{color:var(--muted)} .receipt dd{margin:0;font-weight:600}
.labels{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.label{background:#fff;color:#000;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:.78rem}
.label svg{max-width:100%;height:auto}
.auth{max-width:440px;margin:7vh auto}
.lang{min-width:72px}
.camwrap{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;margin-bottom:12px;max-width:100%}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.camwrap .frame{position:absolute;inset:22% 8%;border:3px solid #3fd6b8;border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.camwrap .tip{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font-size:.9rem}
.scanmodes{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:14px}
.divider{border:0;border-top:1px solid var(--line);margin:16px 0}
.busy{opacity:.6;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.card,.receipt{animation:rise .18s ease-out}}
@keyframes rise{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>(D.lib?D.lib.currency:"৳")+Number(v).toFixed(2);
const bookById=id=>D.books.find(b=>b.id===id);
const memberById=id=>D.members.find(m=>m.id===id);
const onLoanCount=bookId=>D.loans.filter(l=>l.book_id===bookId).length;
const availOf=b=>b.copies-onLoanCount(b.id);
const normPhone=p=>String(p||"").replace(/[^\d+]/g,"");

/* map database error codes to friendly text */
function errText(e){
  const m=String((e&&(e.message||e.error_description))||e||"");
  const map={out_of_stock:"outOfStock",no_stock:"noStock",limit_hit:"limitHit",name_phone_required:"needNamePhone",due_in_past:"datePast",book_not_found:"notFound"};
  for(const k in map)if(m.includes(k))return t(map[k]);
  if(/foreign key|violates.*constraint.*loans/i.test(m))return t("removeBlocked");
  if(/members_library_id_phone/i.test(m))return t("phoneUsed");
  if(/Invalid login/i.test(m))return t("badLogin");
  if(/Failed to fetch|NetworkError/i.test(m))return t("netErr");
  return m||t("netErr");
}

/* ---------- data loading ---------- */
async function loadAll(){
  const [b,m,l,s]=await Promise.all([
    sb.from("books").select("*").order("id"),
    sb.from("members").select("*").order("id"),
    sb.from("loans").select("*").is("returned_date",null).order("due_date"),
    sb.from("sales").select("*").order("id",{ascending:false}).limit(200)
  ]);
  const bad=[b,m,l,s].find(x=>x.error);if(bad)throw bad.error;
  D.books=b.data.map(x=>({...x,price:Number(x.price)}));D.members=m.data;D.loans=l.data;D.sales=s.data.map(x=>({...x,price:Number(x.price)}));
}
async function loadLibrary(){
  let {data,error}=await sb.from("libraries").select("*").maybeSingle();
  if(error)throw error;
  if(!data){
    const name=(D.user.user_metadata&&D.user.user_metadata.library_name)||D.user.email;
    const r=await sb.from("libraries").insert({owner_id:D.user.id,name}).select().single();
    if(r.error)throw r.error;data=r.data;
  }
  D.lib=data;
}
async function boot(session){
  D.user=session?session.user:null;
  if(!D.user){D.lib=null;ui.loading=false;render();return}
  ui.loading=true;render();
  try{await loadLibrary();await loadAll();ui.err=""}catch(e){ui.err=errText(e)}
  ui.loading=false;render();
}
/* run an async action with a busy state, then reload and render */
async function act(fn){
  if(ui.busy)return;ui.busy=true;ui.err="";ui.msg="";render();
  try{await fn();}catch(e){ui.err=errText(e)}
  try{if(D.lib)await loadAll()}catch(e){ui.err=ui.err||errText(e)}
  ui.busy=false;render();
}

/* ---------- actions ---------- */
function findBook(raw){
  const q=String(raw||"").trim().toUpperCase();if(!q)return null;
  const digits=q.replace(/[\s-]/g,"");
  let b=D.books.find(x=>x.code.toUpperCase()===q);
  if(!b&&/^\d{10,13}$/.test(digits))b=D.books.find(x=>x.isbn&&x.isbn===digits);
  if(!b&&/^\d{1,6}$/.test(q))b=D.books.find(x=>x.id===Number(q));
  return b||null;
}
async function rpc(name,args){const {data,error}=await sb.rpc(name,args);if(error)throw error;return data}
function receiptText(r){
  const out=[(r.kind==="loan"?t("loanReceipt"):t("invoice"))+" "+r.no,t("date")+": "+r.date,t("book")+": "+r.book,t("member")+": "+r.who];
  if(r.kind==="loan")out.push(t("dueOn")+": "+r.due);
  else{out.push(t("amount")+": "+money(r.amount));out.push(t("method")+": "+(r.method==="cash"?t("cash"):t("transfer")))}
  return out.join("\n");
}

/* ---------- camera scanning ---------- */
let camStream=null,camTimer=null,zxReader=null;
function stopCam(){
  if(camTimer){clearInterval(camTimer);camTimer=null}
  if(zxReader){try{zxReader.reset()}catch(e){}zxReader=null}
  if(camStream){camStream.getTracks().forEach(tr=>tr.stop());camStream=null}
}
function onScanned(raw){
  if(!ui.cam&&!ui.photoBusy)return;
  stopCam();ui.cam=false;ui.photoBusy=false;ui.err="";ui.msg="";
  const b=findBook(raw);
  if(b)ui.k={step:"book",bookId:b.id};else ui.err=t("notFound")+" ("+String(raw).slice(0,20)+")";
  render();
}
async function startCam(){
  ui.cam=true;ui.err="";ui.msg="";render();
  const v=document.getElementById("cam");
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!v)throw new Error("nocam");
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
    v.srcObject=camStream;await v.play();
    if(window.BarcodeDetector){
      const det=new BarcodeDetector({formats:["code_128","code_39","ean_13","qr_code"]});
      camTimer=setInterval(async()=>{try{const r=await det.detect(v);if(r&&r.length)onScanned(r[0].rawValue)}catch(e){}},250);
    }else if(window.ZXing){
      zxReader=new ZXing.BrowserMultiFormatReader();
      zxReader.decodeFromStream(camStream,v,(res)=>{if(res)onScanned(res.getText())});
    }else throw new Error("nolib");
  }catch(e){stopCam();ui.cam=false;ui.err=t("camFail");render()}
}
async function decodePhoto(file){
  const url=URL.createObjectURL(file);let text=null;
  try{
    if(window.BarcodeDetector){try{const img=new Image();img.src=url;await img.decode();const r=await new BarcodeDetector().detect(img);if(r&&r.length)text=r[0].rawValue}catch(e){}}
    if(!text&&window.ZXing){try{const rd=new ZXing.BrowserMultiFormatReader();const res=await rd.decodeFromImageUrl(url);text=res.getText();rd.reset()}catch(e){}}
  }finally{URL.revokeObjectURL(url)}
  return text;
}
document.addEventListener("change",async e=>{
  if(!e.target||e.target.id!=="photo"||!e.target.files||!e.target.files[0])return;
  ui.photoBusy=true;
  const text=await decodePhoto(e.target.files[0]);
  if(text)onScanned(text);else{ui.photoBusy=false;ui.err=t("photoFail");render()}
});

  const head=`<thead><tr><th>${t("member")}</th><th>${t("book")}</th><th>${t("due")}</th><th class="num">${t("daysLate")}</th><th></th></tr></thead>`;
  return `${ui.err?`<div class="err">${esc(ui.err)}</div>`:""}<div class="tiles">
   <div class="tile"><b>${D.books.length}</b><span>${t("tBooks")}</span></div>
   <div class="tile"><b>${D.books.reduce((s,b)=>s+b.copies,0)}</b><span>${t("tCopies")}</span></div>
   <div class="tile"><b>${ol.length}</b><span>${t("tOnLoan")}</span></div>
   <div class="tile ${overdue.length?"alert":""}"><b>${overdue.length}</b><span>${t("tOverdue")}</span></div>
   <div class="tile"><b>${money(totalSales)}</b><span>${t("tSales")}</span></div></div>
  <h2>${t("overdueList")}</h2>
  ${overdue.length?`<div class="tablewrap" style="margin-bottom:20px"><table>${head}<tbody>${overdue.map(loanRow).join("")}</tbody></table></div>`:`<p class="muted">${t("noOverdue")}</p>`}
  <h2>${t("currentLoans")}</h2>
  ${ol.length?`<div class="tablewrap" style="margin-bottom:20px"><table>${head}<tbody>${ol.map(loanRow).join("")}</tbody></table></div>`:`<p class="muted">${t("noLoans")}</p>`}
  <h2>${t("salesList")}</h2>
  ${D.sales.length?`<div class="tablewrap"><table><thead><tr><th>${t("receiptNo")}</th><th>${t("date")}</th><th>${t("book")}</th><th>${t("member")}</th><th class="num">${t("amount")}</th></tr></thead><tbody>${D.sales.map(s=>`<tr><td>${esc(s.invoice_no)}</td><td>${esc(s.sold_on)}</td><td>${esc(s.book_title)}</td><td>${esc(s.buyer||"-")}</td><td class="num">${money(s.price)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">${t("noSales")}</p>`}`;
}
function settingsView(){
  const l=D.lib;
  return `<form class="card" data-form="settings" style="max-width:520px"><h3>${t("settings")}</h3>
   <div class="field"><label for="sn">${t("libname")}</label><input id="sn" value="${esc(l.name)}"></div>
   <div class="field"><label for="sl">${t("setLoanDays")}</label><input id="sl" type="number" min="1" value="${l.loan_days}"></div>
   <div class="field"><label for="sm">${t("setMaxLoans")}</label><input id="sm" type="number" min="1" value="${l.max_loans}"></div>
   <div class="field"><label for="sc">${t("setCurrency")}</label><input id="sc" maxlength="4" value="${esc(l.currency)}"></div>
   <div class="field"><label for="sp">${t("setPin")}</label><input id="sp" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(l.kiosk_pin||"")}"></div>
   ${ui.err?`<div class="err">${esc(ui.err)}</div>`:""}
   ${ui.msg?`<div class="ok">${esc(ui.msg)}</div>`:""}
   <button class="btn primary" type="submit">${t("save")}</button></form>`;
}

/* ---------- events ---------- */
function go(fn){ui.err="";ui.msg="";fn();render()}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el){
    const tab=ui.locked?"kiosk":ui.tab;
    if(D.lib&&tab==="kiosk"&&ui.k.step==="scan"&&!e.target.closest("input,button,select,a,label")){const i=document.getElementById("scan");if(i)i.focus()}
    return;
  }
  const a=el.dataset.act,v=el.dataset.v,id=Number(el.dataset.id);
  if(a==="camstart"){startCam();return}
  if(a==="camstop"){ui.cam=false;stopCam();render();return}
  if(a==="lang")go(()=>{lang=lang==="bn"?"en":"bn";try{localStorage.setItem("library-kiosk-lang",lang)}catch(e){}});
  else if(a==="authtab")go(()=>{ui.authTab=v});
  else if(a==="logout"){ui.tab="kiosk";ui.k={step:"scan"};sb.auth.signOut()}
  else if(a==="refresh")act(async()=>{});
  else if(a==="tab"){ui.tab=v;ui.k={step:"scan"};ui.confirmDel=null;act(async()=>{})}
  else if(a==="lock")go(()=>{ui.locked=true;ui.tab="kiosk";ui.k={step:"scan"}});
  else if(a==="unlockform")go(()=>{ui.unlocking=true});
  else if(a==="unlockcancel")go(()=>{ui.unlocking=false});
  else if(a==="kstep")go(()=>{ui.k.step=v});
  else if(a==="kreset")go(()=>{ui.k={step:"scan"}});
  else if(a==="kreturn")act(async()=>{const ok=await rpc("return_loan",{p_loan_id:id});ui.k={step:"scan"};if(ok)ui.msg=t("returnedMsg")});
  else if(a==="kcopy"){
    const txt=receiptText(ui.k.receipt);
    try{navigator.clipboard.writeText(txt).then(()=>{const c=document.getElementById("copied");if(c)c.textContent=t("copied")},()=>{})}catch(err){}
  }
  else if(a==="copies")act(async()=>{const b=bookById(id);if(!b)return;const n=b.copies+Number(el.dataset.d);
    if(n>=onLoanCount(b.id)&&n>=0){const {error}=await sb.from("books").update({copies:n}).eq("id",id);if(error)throw error}});
  else if(a==="askdel")go(()=>{ui.confirmDel=v+id});
  else if(a==="delcancel")go(()=>{ui.confirmDel=null});
  else if(a==="delbook")act(async()=>{ui.confirmDel=null;if(onLoanCount(id)>0)throw new Error(t("onLoanNoRemove"));
    const {error}=await sb.from("books").delete().eq("id",id);if(error)throw error});
  else if(a==="delmember")act(async()=>{ui.confirmDel=null;const {error}=await sb.from("members").delete().eq("id",id);if(error)throw error});
  else if(a==="markret")act(async()=>{await rpc("return_loan",{p_loan_id:id})});
});

document.addEventListener("submit",e=>{
  const f=e.target.closest("form[data-form]");if(!f)return;
  e.preventDefault();
  const kind=f.dataset.form,val=id=>{const x=document.getElementById(id);return x?x.value:""};
  ui.err="";ui.msg="";
  if(kind==="login"){
    const email=val("aemail").trim(),pass=val("apass");ui.authEmail=email;
    if(!email||!pass){ui.err=t("fillAll");render();return}
    act(async()=>{const {error}=await sb.auth.signInWithPassword({email,password:pass});if(error)throw error});
  }else if(kind==="register"){
    const name=val("aname").trim(),email=val("aemail").trim(),pass=val("apass");ui.authEmail=email;
    if(!name||!email||!pass){ui.err=t("fillAll");render();return}
    act(async()=>{
      const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{library_name:name},emailRedirectTo:location.href.split("#")[0]}});
      if(error)throw error;
      if(!data.session){ui.msg=t("checkEmail");ui.authTab="login"}
    });
  }else if(kind==="unlock"){
    const entered=val("upass").trim(),pin=D.lib.kiosk_pin;
    if(entered&&pin&&entered===pin){ui.locked=false;ui.unlocking=false;render();return}
    if(!entered){ui.err=t("wrongPass");render();return}
    act(async()=>{const {error}=await sb.auth.signInWithPassword({email:D.user.email,password:entered});
      if(error)throw new Error(t("wrongPass"));ui.locked=false;ui.unlocking=false});
  }else if(kind==="scan"){
    const b=findBook(val("scan"));
    if(b)ui.k={step:"book",bookId:b.id};else ui.err=t("notFound");
    render();
  }else if(kind==="borrow"){
    const b=bookById(ui.k.bookId);
    ui.k.phone=val("kphone");ui.k.name=val("kname");ui.k.due=val("kdue");
    const known=D.members.find(m=>normPhone(m.phone)===normPhone(ui.k.phone));
    if(known&&!ui.k.name.trim())ui.k.name=known.name;
    act(async()=>{
      const loan=await rpc("borrow_book",{p_book_id:b.id,p_name:ui.k.name,p_phone:normPhone(ui.k.phone),p_due:ui.k.due});
      const who=(known?known.name:ui.k.name.trim())+" ("+normPhone(ui.k.phone)+")";
      ui.k={step:"receipt",receipt:{kind:"loan",no:"LN-"+pad(loan.id,4),date:loan.out_date,book:b.title,who,due:loan.due_date}};
    });
  }else if(kind==="buy"){
    const b=bookById(ui.k.bookId),buyer=val("bname"),phone=normPhone(val("bphone")),method=val("bmethod");
    act(async()=>{
      const s=await rpc("buy_book",{p_book_id:b.id,p_buyer:buyer,p_phone:phone,p_method:method});
      ui.k={step:"receipt",receipt:{kind:"sale",no:s.invoice_no,date:s.sold_on,book:s.book_title,who:s.buyer||"-",amount:Number(s.price),method:s.method}};
    });
  }else if(kind==="addbook"){
    const title=val("nt").trim(),isbn=val("ni").replace(/[\s-]/g,"");
    const copies=Math.max(1,parseInt(val("nn"),10)||1);
    if(!title){ui.err=t("fillAll");render();return}
    if(isbn&&!/^\d{10}$|^\d{13}$/.test(isbn)){ui.err=t("isbnBad");render();return}
    const dup=isbn?D.books.find(x=>x.isbn===isbn):null;
    act(async()=>{
      if(dup){const {error}=await sb.from("books").update({copies:dup.copies+copies}).eq("id",dup.id);if(error)throw error;ui.msg=t("isbnAdded");return}
      const {error}=await sb.from("books").insert({library_id:D.lib.id,code:"",isbn:isbn||null,title,author:val("na").trim(),category:val("nc").trim(),copies,price:Math.max(0,parseFloat(val("np"))||0)});
      if(error)throw error;
    });
  }else if(kind==="addmember"){
    const n=val("mn").trim(),p=normPhone(val("mp"));
    if(!n||!p){ui.err=t("needNamePhone");render();return}
    act(async()=>{const {error}=await sb.from("members").insert({library_id:D.lib.id,name:n,phone:p});if(error)throw error});
  }else if(kind==="settings"){
    const pin=val("sp").trim();
    if(pin&&!/^\d{4}$/.test(pin)){ui.err=t("pinBad");render();return}
    const patch={name:val("sn").trim()||D.lib.name,loan_days:Math.max(1,parseInt(val("sl"),10)||14),max_loans:Math.max(1,parseInt(val("sm"),10)||3),currency:val("sc")||"৳",kiosk_pin:pin||null};
    act(async()=>{const {data,error}=await sb.from("libraries").update(patch).eq("id",D.lib.id).select().single();if(error)throw error;D.lib=data;ui.msg=t("saved")});
  }
});

/* ---------- start ---------- */
render();
let lastUid,booted=false;
sb.auth.onAuthStateChange((event,session)=>{
  const uid=session?session.user.id:null;
  if(booted&&uid===lastUid&&event!=="SIGNED_OUT"){D.user=session?session.user:null;return}
  booted=true;lastUid=uid;
  setTimeout(()=>boot(session),0);
});
/* safety net: never stay on the loading screen */
setTimeout(()=>{if(!booted){booted=true;sb.auth.getSession().then(r=>boot(r.data.session)).catch(()=>{ui.loading=false;ui.err=t("netErr");render()})}},4000);
</script>
